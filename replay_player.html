<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 session replay</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9eef6;background:#0e1117;font-size:13px}
*{box-sizing:border-box}body{margin:0;padding:1px}button,select,input{font:inherit}button,select{background:#1c2636;color:#edf3fc;border:1px solid #344359;border-radius:7px;padding:8px 11px;cursor:pointer}button:hover,select:hover{border-color:#91a8c9}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7dd8ec;outline-offset:3px}button[aria-pressed=true]{background:#283852;border-color:#7798c5}button:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.title{font-weight:700;font-size:17px;margin:0 0 4px}.muted{color:#a6b4c8;font-size:12px}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock strong{font-size:23px;letter-spacing:1px}.clock span{display:block;margin-top:3px;color:#a6b4c8}
.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,1fr);gap:14px}.map{background:radial-gradient(ellipse at center,#172131,#101720 75%);border:1px solid #29364a;border-radius:12px;position:relative;overflow:hidden;min-width:0;height:570px}canvas{display:block;width:100%;height:100%}.map-caption{position:absolute;left:16px;top:13px;pointer-events:none;color:#acb9cd;font-size:11px}.map-flags{position:absolute;bottom:13px;left:14px;right:14px;background:#0c121de6;border-radius:6px;padding:8px 10px;min-height:30px;color:#c3cfdf;font-size:11px}.map-empty{position:absolute;top:44%;left:12%;right:12%;text-align:center;color:#a6b4c8;pointer-events:none}
.board{border:1px solid #29364a;border-radius:12px;overflow:hidden;background:#111925;min-width:0}.board-top{padding:12px;background:#151e2c}.board-title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:10px}.board-title strong{font-size:15px}.board-controls{display:flex;gap:6px;flex-wrap:wrap}.board-controls select{flex:1;min-width:140px;font-size:11px;padding:7px}.board-controls button{font-size:11px;padding:7px 9px}.list{max-height:456px;overflow:auto}.list table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.list th{position:sticky;top:0;background:#182234;color:#a8b6cc;font-size:10px;text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:8px 5px;z-index:1}.list th:nth-child(2){text-align:left}.list th:first-child{width:30px;text-align:center}.list td{padding:8px 5px;border-top:1px solid #263246;text-align:right;font-size:11px;white-space:nowrap}.list td:first-child{text-align:center;color:#9cafc8}.list td:nth-child(2){text-align:left}.driver-button{padding:0 0 0 6px;border:0;border-left:3px solid var(--team);border-radius:0;background:transparent;font-weight:750;letter-spacing:.5px;min-width:48px;text-align:left}.driver-button:hover{color:#fff;background:transparent}.list tr.selected{background:#22314a}.list tr.filtered{opacity:.48}.tyre{display:inline-grid;place-items:center;width:19px;height:19px;font-weight:800;border:1px solid currentColor;border-radius:50%;margin-right:4px}.age{color:#acbdd4;font-size:10px}.coverage{font-size:10px;color:#9aabc2;padding:9px 12px;border-top:1px solid #29364a;line-height:1.5}
.transport{background:#151e2c;border:1px solid #29364a;border-radius:11px;margin-top:13px;padding:13px 15px}.timeline{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}.timeline input{width:100%;accent-color:#ff5363;cursor:pointer}.timeline span{color:#adbad0;min-width:40px;font-size:11px}.transport-buttons{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}.transport-buttons .primary{background:#ed4659;border-color:#ed4659;color:white;font-weight:700;min-width:85px}.transport-buttons label{margin-left:auto;display:flex;align-items:center;gap:7px;color:#b6c4d8;font-size:11px}.transport-buttons select{padding:7px}.transport-buttons .secondary-label{margin-left:10px;color:#a9b7cc;font-size:11px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:13px}.driver-card{border:1px solid #29364a;border-top:3px solid var(--team);border-radius:9px;background:#131c2a;padding:12px;min-width:0}.card-name{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px}.card-name strong{font-size:16px}.card-name span{font-size:10px;color:#acbdd4}.values{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.values label{display:block;font-size:9px;color:#9cadc6;letter-spacing:.4px;text-transform:uppercase}.values strong{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:3px}.values small{font-size:9px;font-weight:400}.pedals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.pedals label{font-size:9px;color:#9cadc6;text-transform:uppercase}.meter{height:5px;background:#273247;border-radius:4px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:#32d8b2;transition:width .1s}.meter.brake i{background:#ff626b}.note{margin:12px 0 0;color:#9aacc5;font-size:11px;line-height:1.6}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#98abc4;font-size:11px;margin-top:10px}.help label{display:flex;gap:6px;align-items:center;cursor:pointer}.error{padding:20px;border:1px solid #ed4659;border-radius:8px;color:#ffb9c0}
@media(max-width:800px){.layout{grid-template-columns:1fr}.map{height:430px}.list{max-height:370px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.driver-card:last-child:nth-child(odd){grid-column:1 / -1}.top{padding-top:3px}.clock strong{font-size:20px}.transport-buttons label{margin-left:0}.map-caption{max-width:75%}}@media(max-width:430px){.map{height:350px}.cards{grid-template-columns:1fr}.driver-card:last-child:nth-child(odd){grid-column:auto}.secondary-label{display:none}.title{font-size:15px}}
</style>
</head>
<body>
<main id="player">
 <div class="top"><div><p class="title" id="sessionTitle">Session replay</p><div class="muted" id="sessionDetail"></div></div><div class="clock"><strong id="clock">00:00</strong><span id="lapLabel">Recorded session</span></div></div>
 <div class="layout">
  <section class="map" aria-label="Recorded car positions"><canvas id="track" aria-label="Circuit and driver positions" role="img"></canvas><span class="map-caption" id="mapCaption">Recorded positions · interpolated playback</span><div class="map-empty" id="mapEmpty" hidden>No recorded car positions at this time</div><div class="map-flags" id="raceMessage" aria-live="off">Session ready</div></section>
  <section class="board" aria-label="Timing tower"><div class="board-top"><div class="board-title"><strong id="boardTitle">Timing tower</strong><span class="muted" id="driverCount"></span></div><div class="board-controls"><select id="gapMode" aria-label="Gap display"><option value="interval">Gap ahead and behind</option><option value="leader">Gap to leader</option></select><button id="strategy" aria-pressed="false">Show pit stops</button></div></div><div class="list"><table aria-label="Driver timing"><thead><tr><th>Pos</th><th>Driver</th><th id="gapHeading">Ahead</th><th id="backHeading">Behind</th><th id="strategyHeading">Tyre · age</th></tr></thead><tbody id="leaderboard"></tbody></table></div><div class="coverage" id="coverage"></div></section>
 </div>
 <section class="transport" aria-label="Playback controls"><div class="timeline"><span id="elapsed">00:00</span><input id="seek" type="range" min="0" value="0" step="0.1" aria-label="Replay timeline"><span id="duration">00:00</span></div><div class="transport-buttons"><button class="primary" id="play" aria-label="Play replay">Play</button><button id="restart">Restart</button><button id="back" aria-label="Back 10 seconds">↶ 10s</button><button id="forward" aria-label="Forward 10 seconds">10s ↷</button><span class="secondary-label">Space to pause · arrow keys to seek</span><label>Speed <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8" selected>8×</option><option value="16">16×</option><option value="32">32×</option><option value="64">64×</option></select></label></div></section>
 <div class="help"><span>Select drivers in the timing tower to compare up to three telemetry cards.</span><label><input type="checkbox" id="labels" checked> Driver labels</label></div>
 <section class="cards" id="cards" aria-label="Selected driver telemetry"></section>
 <p class="note" id="sourceNote"></p>
</main>
<script id="replay-data" type="application/json">__REPLAY_DATA__</script>
<script>__REPLAY_SCRIPT__</script>
</body></html>

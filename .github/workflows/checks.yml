name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q main.py dashboard.py online.py hosting.py data.py jolpica_client.py weekend.py hosted_data.py archive_source.py archive_analysis.py archive_replay.py openf1_data.py web_replay.py replay_timing.py replay_player.py launch.py replay_insights.py replay_overlays.py replay_strategy.py championship_data.py championship_overlays.py season_analysis.py
